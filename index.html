<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Speedrun six daily puzzles on one clock, or practice any of them as much as you want.">
</head>
<body>
<title>Puzzle Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,700;1,9..144,900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one centered 640px column on a periwinkle sky, white paper section below.
   Thick-outlined cards with hard offset shadows; italic serif for buttons and moments. */
:root {
  --sky: #b4cff8;
  --sky-deep: #9dbdf0;
  --paper: #ffffff;
  --ink: #121212;
  --lilac: #ecd3fa;
  --butter: #fdf0b4;
  --mint: #a6e4b6;
  --tile: #e8eef8;
  --miss: #c3cde0;
  --muted: #586174;
  --line: #d3dae6;
  --rose: #f9b4b4;
  --good: #1f8f4e;
  --bad: #c43b3b;
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

.wrap { width: 100%; max-width: 640px; margin: 0 auto; padding-inline: 16px; }
.sky { padding-block: 0 28px; }
.paper { background: var(--paper); padding-block: 28px 64px; min-height: 40vh; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sky); border-bottom: 1px solid rgba(18,18,18,.08); }
.bar .wrap { display: flex; align-items: center; gap: 12px; min-height: 58px; }
.bar .mid { flex: 1; min-width: 0; }
.wordmark { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 22px; background: var(--lilac); padding: 0 6px; line-height: 1.25; letter-spacing: -.01em; }
.iconbtn { width: 40px; height: 40px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; padding: 0; flex: none; }
.iconbtn.flat { border-color: transparent; background: transparent; }
.iconbtn svg { width: 22px; height: 22px; }
.bar-title { font-weight: 800; font-size: 15px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-sub { font-size: 12px; color: var(--muted); line-height: 1.2; }

/* primitives */
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--ink); }
.pill { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 18px; border: 2.5px solid var(--ink); border-radius: 999px; padding: 9px 30px; background: var(--lilac); box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; white-space: nowrap; }
.pill:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
.pill:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.pill.butter { background: var(--butter); }
.pill.mint { background: var(--mint); }
.pill.white { background: var(--paper); }
.pill.small { font-size: 15px; padding: 6px 18px; }
.pill:disabled { background: transparent; border-color: #8a93a6; color: #6b7487; box-shadow: none; cursor: default; transform: none; }
.hl { font-family: var(--display); font-style: italic; font-weight: 900; background: var(--butter); padding: 0 6px; }
.eyebrow { font-size: 12px; color: var(--muted); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--tile); white-space: nowrap; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.center { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; }
.stack { display: grid; gap: 14px; }
.muted { color: var(--muted); }
.good { color: var(--good); }
.bad { color: var(--bad); }

/* home */
.hero { margin-top: 22px; padding: 26px 22px 22px; text-align: center; display: grid; gap: 16px; justify-items: center; }
.hero h1 { font-size: 22px; font-weight: 800; }
.hero .lede { font-size: 19px; max-width: 30ch; }
.stage-icons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.stage-icons span { width: 40px; height: 40px; border-radius: 10px; background: var(--tile); display: grid; place-items: center; }
.stage-icons svg { width: 24px; height: 24px; }
.hero-meta { font-size: 13px; color: var(--muted); }
.tagline { text-align: center; margin: 22px 0 16px; font-size: 17px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.tile { background: rgba(255,255,255,.62); border-radius: 12px; padding: 12px 8px; display: grid; justify-items: center; gap: 6px; text-align: center; border: 2.5px solid transparent; min-width: 0; }
.tile svg { width: 30px; height: 30px; }
.tile b { font-size: 14px; }
.tile small { font-size: 12px; color: var(--muted); line-height: 1.2; }
button.tile { cursor: pointer; }
button.tile.on { background: var(--paper); border-color: var(--ink); }
button.tile:not(.on) { opacity: .55; }
.stat-val { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.section-title { font-size: 17px; font-weight: 800; margin-bottom: 12px; }
.list { display: grid; gap: 10px; }
.item { display: flex; align-items: center; gap: 14px; background: #f1f3f6; border-radius: 14px; padding: 12px 14px; border: 0; text-align: left; width: 100%; }
button.item:hover { background: #e9edf3; }
.item .ic { width: 44px; height: 44px; border-radius: 10px; background: var(--paper); border: 2px solid var(--ink); display: grid; place-items: center; flex: none; }
.item .ic svg { width: 26px; height: 26px; }
.item .txt { flex: 1; min-width: 0; }
.item .txt b { display: block; font-size: 16px; font-weight: 600; }
.item .txt small { display: block; font-size: 12px; color: var(--muted); }
.item .txt p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.item .chip { background: var(--paper); }
.empty { background: #f1f3f6; border-radius: 14px; padding: 16px; font-size: 14px; color: var(--muted); }

/* run */
.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 20px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 4px 14px; min-width: 104px; text-align: center; box-shadow: 3px 3px 0 var(--ink); }
.timer.frozen { background: var(--mint); }
.splits { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 6px; margin: 14px 0 6px; }
.split { background: rgba(255,255,255,.55); border-radius: 10px; padding: 6px 4px; display: grid; justify-items: center; gap: 1px; border: 2px solid transparent; min-width: 0; }
.split svg { width: 20px; height: 20px; }
.split .t { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.split .d { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; min-height: 1.2em; }
.split.now { background: var(--paper); border-color: var(--ink); }
.split.done { background: var(--paper); }
.penflash { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 66px); transform: translateX(-50%); background: var(--rose); border: 2.5px solid var(--ink); border-radius: 999px; padding: 4px 14px; font-weight: 800; z-index: 40; animation: pop 1.4s ease forwards; pointer-events: none; }
.penflash.bonus { background: var(--mint); }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, 6px); } 12% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }
.stage { padding-block: 14px 24px; }
.stage-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.stage-title h2 { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 26px; }
.stage-title small { font-size: 13px; color: var(--muted); }
.splitcard { margin: 16px auto 0; padding: 16px 18px; text-align: center; max-width: 420px; display: grid; gap: 4px; animation: rise .25s ease; }
.splitcard .big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
@keyframes rise { from { transform: translateY(8px); opacity: .3; } to { transform: none; opacity: 1; } }
.countdown { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: rgba(180,207,248,.85); }
.countdown span { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 120px; animation: rise .3s ease; }

/* keyboard */
.kb { display: grid; gap: 6px; margin-top: 18px; user-select: none; }
.kb-row { display: flex; gap: 5px; justify-content: center; }
.key { flex: 1; max-width: 52px; height: 48px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 600; font-size: 15px; padding: 0; display: grid; place-items: center; touch-action: manipulation; }
.key.wide { max-width: 76px; flex: 1.5; font-size: 12px; font-weight: 800; }
.key svg { width: 20px; height: 20px; }
.key.hit { background: var(--mint); border-color: var(--ink); }
.key.near { background: var(--butter); border-color: var(--ink); }
.key.miss { background: var(--miss); color: #5d6576; }

/* letter boxes (joined) */
.boxes { display: inline-flex; border: 3px solid var(--ink); border-radius: 6px; background: var(--paper); overflow: hidden; max-width: 100%; }
.box { width: 40px; height: 44px; display: grid; place-items: center; font-weight: 800; font-size: 22px; text-transform: uppercase; border-right: 2.5px solid var(--ink); }
.box:last-child { border-right: 0; }
.box.cur { background: var(--lilac); }
.box.locked { background: var(--tile); }

/* word */
.wboard { display: grid; gap: 7px; justify-content: center; }
.wrow { display: flex; gap: 7px; }
.wtile { width: 54px; height: 54px; border: 2.5px solid var(--line); border-radius: 8px; background: var(--paper); display: grid; place-items: center; font-weight: 800; font-size: 26px; }
.wtile.filled { border-color: var(--ink); }
.wtile.hit, .wtile.near, .wtile.miss { border-color: var(--ink); animation: flip .35s ease; }
.wtile.hit { background: var(--mint); }
.wtile.near { background: var(--butter); }
.wtile.miss { background: var(--miss); }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

/* country input */
.ac { position: relative; }
.ac input { width: 100%; font: inherit; font-size: 17px; padding: 12px 16px; border: 3px solid var(--ink); border-radius: 12px; background: var(--paper); color: var(--ink); }
.ac ul { list-style: none; margin: 6px 0 0; padding: 6px; position: absolute; left: 0; right: 0; top: 100%; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 12px; z-index: 15; box-shadow: 4px 4px 0 var(--ink); max-height: 260px; overflow-y: auto; }
.ac li { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.ac li.on { background: var(--lilac); }

/* silhouette */
.sil { padding: 10px; display: grid; justify-items: center; }
.sil svg { width: 100%; max-width: 360px; height: auto; display: block; }
.sil path { fill: var(--ink); }
.reveal-name { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 22px; margin-top: 4px; }
.guesses { display: grid; gap: 6px; margin: 14px 0; }
.g { display: grid; grid-template-columns: minmax(0, 1fr) 84px 32px 52px; gap: 8px; align-items: center; background: rgba(255,255,255,.62); border-radius: 10px; padding: 7px 12px; min-height: 40px; font-weight: 600; font-size: 15px; }
.g.full { background: var(--paper); border: 2px solid var(--ink); }
.g.win { background: var(--mint); }
.g .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g .km, .g .pc { text-align: right; font-variant-numeric: tabular-nums; }
.g svg { width: 22px; height: 22px; display: block; margin: 0 auto; }

/* globe */
.globe-wrap { position: relative; display: grid; justify-items: center; }
.globe-wrap canvas { width: 100%; max-width: 460px; aspect-ratio: 1; touch-action: none; cursor: grab; display: block; }
.globe-wrap canvas:active { cursor: grabbing; }
.zoom { position: absolute; right: 0; bottom: 6px; display: grid; gap: 6px; }
.glist { display: grid; gap: 6px; margin-top: 14px; }
.gl { display: flex; align-items: center; gap: 10px; background: var(--paper); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: 15px; }
.gl i { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--ink); flex: none; }
.gl span { flex: 1; min-width: 0; }
.gl em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); justify-content: center; margin-top: 6px; }
.legend b { display: block; width: 140px; max-width: 40vw; height: 10px; border-radius: 99px; border: 1.5px solid var(--ink); background: linear-gradient(90deg, #8a0f12, #e2452a, #fb923c, #fcd34d, #fff7d6); }

/* cryptic */
.clue { background: var(--paper); border-radius: 10px; padding: 18px 20px; font-size: 21px; line-height: 1.5; }
.clue mark { background: transparent; color: inherit; padding: 0 1px; border-radius: 3px; }
.clue mark.def { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; text-decoration-color: #9b51e0; background: var(--lilac); }
.clue mark.ind { background: var(--butter); }
.clue mark.fod { box-shadow: inset 0 -3px 0 #4f8de8; }
.cboxes { display: grid; justify-items: center; margin: 26px 0 8px; }
.dots { display: flex; gap: 6px; justify-content: center; align-items: flex-start; margin: 14px 0 0; flex-wrap: wrap; }
.dot { display: grid; justify-items: center; gap: 2px; }
.dot i { width: 15px; height: 15px; border-radius: 99px; background: rgba(255,255,255,.6); display: block; }
.dot.used i { background: var(--ink); }
.dot.par i { border: 2px solid var(--ink); }
.dot small { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 13px; }
.actions { display: flex; justify-content: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
.hints { display: grid; gap: 8px; margin-top: 16px; }
.hint { background: var(--paper); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
.hint .txt { flex: 1; min-width: 0; font-size: 15px; }
.hint .txt b { display: block; font-size: 14px; }
.hint .txt p { margin: 2px 0 0; color: var(--muted); }
.hint.open { border: 2px solid var(--ink); }
.explain { margin-top: 18px; padding: 18px; display: grid; gap: 8px; font-size: 15px; }
.explain b { font-weight: 800; }

/* rare */
.rq { padding: 22px 20px; display: grid; gap: 14px; text-align: center; }
.rq h3 { font-size: 22px; font-weight: 800; }
.tbar { height: 12px; border: 2.5px solid var(--ink); border-radius: 99px; overflow: hidden; background: var(--paper); }
.tbar i { display: block; height: 100%; background: var(--lilac); transform-origin: left; }
.tbar.low i { background: var(--rose); }
.rare-row { display: flex; gap: 10px; }
.rare-row .ac { flex: 1; min-width: 0; }
.badge { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 20px; padding: 4px 14px; border-radius: 999px; border: 2.5px solid var(--ink); display: inline-block; }
.tier0 { background: var(--tile); } .tier1 { background: #dbeafe; } .tier2 { background: var(--butter); } .tier3 { background: var(--lilac); } .tier4 { background: var(--mint); }
.rtable { width: 100%; border-collapse: collapse; font-size: 14px; }
.rtable td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.rtable td:last-child { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* results */
.results { margin-top: 22px; padding: 24px 20px; display: grid; gap: 14px; text-align: center; }
.results .big { font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.stable { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
.stable td { padding: 9px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
.stable td.r { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.stable svg { width: 20px; height: 20px; display: block; }
.scroll-x { overflow-x: auto; }

/* modal + toast */
.modal { position: fixed; inset: 0; background: rgba(18,18,18,.35); display: grid; place-items: center; padding: 16px; z-index: 60; }
.modal .card { width: 100%; max-width: 520px; max-height: 86vh; overflow-y: auto; padding: 22px 20px; }
.modal h2 { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 26px; margin-bottom: 10px; }
.modal h3 { font-size: 16px; margin-top: 14px; }
.modal p, .modal li { font-size: 15px; }
.modal-close { float: right; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 72px); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 14px; z-index: 70; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }

/* unlimited switch */
.switch { display: inline-flex; align-items: center; gap: 7px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--paper); padding: 4px 10px 4px 5px; font-weight: 800; font-size: 13px; white-space: nowrap; }
.switch i { width: 30px; height: 18px; border-radius: 99px; background: var(--miss); position: relative; transition: background .15s; flex: none; }
.switch i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 99px; background: var(--paper); border: 1.5px solid var(--ink); box-sizing: border-box; transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--mint); }
.switch[aria-checked="true"] i { background: var(--ink); }
.switch[aria-checked="true"] i::after { transform: translateX(12px); }

/* border hop */
.hop-head { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.hop-end { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 22px; background: var(--lilac); border: 2.5px solid var(--ink); border-radius: 999px; padding: 2px 16px; }
.hop-arrow svg { width: 26px; height: 26px; transform: rotate(90deg); display: block; }
.hopmap { width: 100%; display: block; border-radius: 10px; }

/* rare pick dive (deliberately dark: the deep sea) */
.dive { --deep: #071a2e; --abyss: #020b16; --glow: #8fd3ff; --rose2: #ff8fa3; position: relative; overflow: hidden; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--ink); background: linear-gradient(180deg, #123a5e 0%, var(--deep) 38%, var(--abyss) 100%); color: #e8f4ff; min-height: 540px; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
.dive > * { min-width: 0; }
.dive-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dive-top { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: start; padding: 14px 14px 0; }
.dive-stat { border: 1.5px solid rgba(143,211,255,.35); border-radius: 10px; padding: 6px 10px; background: rgba(2,11,22,.45); justify-self: start; min-width: 96px; }
.dive-stat:last-child { justify-self: end; }
.dive-cap { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #8fb5d6; font-weight: 700; }
.dive-num { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--glow); text-shadow: 0 0 12px rgba(143,211,255,.55); }
.dive-stat:last-child .dive-num { color: var(--rose2); text-shadow: 0 0 12px rgba(255,143,163,.5); }
.dive-pips { display: flex; gap: 4px; }
.dive-pips i { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid rgba(143,211,255,.5); }
.dive-pips i.done { background: #fdf0b4; border-color: #fdf0b4; }
.dive-pips i.now { background: var(--rose2); border-color: var(--rose2); }
.dive-gauge { position: absolute; left: 18px; top: 92px; bottom: 96px; width: 2px; background: linear-gradient(#8fd3ff66, #8fd3ff11); }
.dive-gauge span { position: absolute; left: 8px; transform: translateY(-50%); font-size: 10px; color: #6f93b3; font-variant-numeric: tabular-nums; }
.dive-sub { position: absolute; left: -2px; top: 0; width: 46px; transform: translate(-6px, -50%); transition: top 1.3s cubic-bezier(.3,.7,.2,1); filter: drop-shadow(0 0 10px rgba(253,240,180,.35)); animation: bob 2.6s ease-in-out infinite; z-index: 2; }
.dive-sub svg { width: 46px; display: block; }
@keyframes bob { 50% { margin-top: 4px; } }
.dive-panel { position: relative; display: grid; place-items: center; align-content: center; gap: 14px; padding: 18px 18px 18px 64px; }

@keyframes surfaceIn { from { transform: translateY(18px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.dive-zone { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 34px; color: var(--glow); text-shadow: 0 0 18px rgba(143,211,255,.6); }

.dive-reveal.tier-3 .dive-zone { color: var(--rose2); text-shadow: 0 0 20px rgba(255,143,163,.65); }
.dive-reveal.tier-4 .dive-zone { color: #a6e4b6; text-shadow: 0 0 24px rgba(166,228,182,.8); animation: shimmer 1.6s ease-in-out infinite; }
.dive-reveal.miss .dive-zone { color: #8fb5d6; text-shadow: none; }
@keyframes shimmer { 50% { text-shadow: 0 0 34px rgba(166,228,182,1); } }
.dive-said { font-size: 17px; font-weight: 700; }
.dive-pts { font-size: 15px; font-weight: 800; color: #fdf0b4; font-variant-numeric: tabular-nums; }
.dive-dock { position: relative; display: flex; gap: 8px; align-items: center; padding: 12px 14px 16px; background: linear-gradient(transparent, rgba(2,11,22,.75)); }
.dive-dock input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 2px solid rgba(143,211,255,.6); background: rgba(2,11,22,.75); color: #e8f4ff; }
.dive-dock input::placeholder { color: #6f93b3; }
.dive-dock input:focus-visible { outline: 2px solid var(--glow); outline-offset: 1px; }
.dive-btn { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 17px; border-radius: 10px; border: 2px solid var(--ink); background: var(--rose2); color: var(--ink); padding: 9px 16px; box-shadow: 3px 3px 0 var(--ink); }
.dive-btn.wide { padding: 10px 28px; background: #fdf0b4; }
.dive-btn:disabled, .dive-pass:disabled { opacity: .45; cursor: default; }
.dive-pass { background: transparent; border: 0; color: #8fb5d6; font-weight: 700; font-size: 13px; text-decoration: underline; padding: 4px; }
.dive-ring { position: relative; width: 46px; height: 46px; flex: none; display: grid; place-items: center; }
.dive-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.dive-ring circle { fill: none; stroke-width: 4; }
.dive-ring .track { stroke: rgba(143,211,255,.18); }
.dive-ring .bar { stroke: var(--glow); stroke-dasharray: 100; stroke-linecap: round; }
.dive-ring b { font-size: 15px; font-variant-numeric: tabular-nums; color: #e8f4ff; }
.dive-ring.low .bar { stroke: var(--rose2); }
.dive-ring.hurt { animation: hurt .4s; }
@keyframes hurt { 30% { transform: scale(1.2); filter: drop-shadow(0 0 8px #ff8fa3); } }

.practice-done { margin-top: 18px; padding: 18px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.loading { text-align: center; padding: 40px 0; font-family: var(--display); font-style: italic; font-weight: 900; font-size: 20px; }
